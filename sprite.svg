<svg xmlns="http://www.w3.org/2000/svg">

    <!-- ==========================================================
         НАВИГАЦИЯ
         ========================================================== -->

    <symbol id="today" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5"/>
        <g transform="translate(12,12)">
            <g>
                <line x1="0" y1="-11" x2="0" y2="-9" transform="rotate(0)"/>
                <line x1="0" y1="-11" x2="0" y2="-9" transform="rotate(60)"/>
                <line x1="0" y1="-11" x2="0" y2="-9" transform="rotate(120)"/>
                <line x1="0" y1="-11" x2="0" y2="-9" transform="rotate(180)"/>
                <line x1="0" y1="-11" x2="0" y2="-9" transform="rotate(240)"/>
                <line x1="0" y1="-11" x2="0" y2="-9" transform="rotate(300)"/>
            </g>
        </g>
    </symbol>

    <symbol id="activities" viewBox="0 0 24 24">
        <polygon points="12 2 17 10 7 10"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <circle cx="17.5" cy="17.5" r="4"/>
    </symbol>

    <symbol id="history" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="12" x2="12" y2="6"/>
        <line x1="12" y1="12" x2="15" y2="15"/>
    </symbol>

    <!--    <symbol id="child" viewBox="0 0 24 24">-->
    <!--        <circle cx="12" cy="7" r="3.5"/>-->
    <!--        <path d="M5.5 20.5c.5-4 3.2-6.5 6.5-6.5s6 2.5 6.5 6.5"/>-->
    <!--    </symbol>-->

    <symbol id="child" viewBox="0 0 24 24">
        <circle cx="12" cy="5" r="4"/>
        <ellipse cx="12" cy="17" rx="7" ry="3"/>
    </symbol>

    <symbol id="settings" viewBox="0 0 24 24">
        <line x1="2" y1="6" x2="5" y2="6"/>
        <line x1="11" y1="6" x2="22" y2="6"/>
        <line x1="2" y1="18" x2="13" y2="18"/>
        <line x1="19" y1="18" x2="22" y2="18"/>
        <circle cx="8" cy="6" r="3"/>
        <circle cx="16" cy="18" r="3"/>
    </symbol>

    <!-- Кубики из иконки приложения, для первого экрана -->
    <symbol id="blocks" viewBox="128 124 256 264">
        <rect x="200" y="132" width="112" height="112" rx="22" fill="#c9a84c"/>
        <rect x="136" y="268" width="112" height="112" rx="22" fill="#7a82da"/>
        <rect x="264" y="268" width="112" height="112" rx="22" fill="#4aaf8c"/>
    </symbol>

    <!-- ==========================================================
         ДЕЙСТВИЯ
         ========================================================== -->

    <symbol id="close" viewBox="0 0 24 24">
        <line x1="6" y1="6" x2="18" y2="18"/>
        <line x1="18" y1="6" x2="6" y2="18"/>
    </symbol>

    <symbol id="plus" viewBox="0 0 24 24">
        <line x1="12" y1="2" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
    </symbol>

    <symbol id="minus" viewBox="0 0 24 24">
        <line x1="5" y1="12" x2="19" y2="12"/>
    </symbol>

    <symbol id="download" viewBox="0 0 24 24">
        <path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>
    </symbol>

    <symbol id="upload" viewBox="0 0 24 24">
        <path d="M12 16V5M7 10l5-5 5 5M5 20h14"/>
    </symbol>

    <symbol id="refresh" viewBox="0 0 24 24">
        <path d="M17.8 8.4A6.4 6.4 0 0 0 6.5 6.3L5 8"/>
        <path d="M5 4.5v3.7h3.7"/>
        <path d="M6.2 15.6a6.4 6.4 0 0 0 11.3 2.1L19 16"/>
        <path d="M19 19.5v-3.7h-3.7"/>
    </symbol>

    <symbol id="ok" viewBox="0 0 24 24">
        <path d="M2 12L10 20L22 2"/>
    </symbol>

    <symbol id="prev" viewBox="0 0 24 24">
        <polyline points="14 6 8 12 14 18"/>
    </symbol>

    <symbol id="diary" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <line x1="8" y1="1" x2="8" y2="3"/>
        <line x1="16" y1="1" x2="16" y2="3"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
    </symbol>

    <symbol id="stats" viewBox="0 0 24 24">
        <circle cx="6" cy="18" r="4" stroke-dasharray="6 1000" stroke-dashoffset="-6"/>
        <line x1="2" y1="1" x2="2" y2="18.2"/>
        <line x1="23" y1="22" x2="5.8" y2="22"/>
        <polyline points="2 18, 8 10, 14 15, 20 6"/>
    </symbol>

    <symbol id="next" viewBox="0 0 24 24">
        <polyline points="10 6 16 12 10 18"/>
    </symbol>

    <symbol id="check" viewBox="0 0 24 24">
        <polyline points="5 12 10 17 19 7"/>
    </symbol>

    <symbol id="heart" viewBox="0 0 24 24" stroke="var(--yellow)">
        <path d="M12 19.2 5.9 14c-2-1.7-2.3-4.7-.7-6.7 1.8-2.2 5-2.2 6.8-.1 1.8-2.1 5-2.1 6.8.1 1.6 2 1.3 5-.7 6.7L12 19.2Z"/>
    </symbol>

    <symbol id="chat" viewBox="0 0 24 24" stroke="var(--blue)">
        <path d="M4.8 11.1C4.8 7.4 8 4.6 12 4.6s7.2 2.8 7.2 6.5-3.2 6.5-7.2 6.5c-1 0-2-.2-2.9-.5L6 19v-3.1c-.8-1.3-1.2-2.9-1.2-4.8Z"/>
    </symbol>

    <symbol id="shield" viewBox="0 0 24 24" stroke="var(--green)">
        <path d="M12 3.8 18.5 6v4.3c0 3.9-2.6 7.3-6.5 8.9-3.9-1.6-6.5-5-6.5-8.9V6L12 3.8Z"/>
    </symbol>

    <symbol id="trash" viewBox="0 0 24 24">
        <path d="M19.65 7.2H4.35"/>
        <path d="M7.05 7.2C7.14 7.2 7.14 7.2 7.14 7.2C7.86 7.2 8.58 6.75 8.76 6.03C8.76 6.03 8.85 5.94 8.85 5.94L8.94 5.67C9.03 5.4 9.03 5.31 9.12 5.22C9.3 4.86 9.66 4.59 10.02 4.5C10.2 4.5 10.29 4.5 10.56 4.5H13.44C13.71 4.5 13.8 4.5 13.98 4.5C14.34 4.59 14.7 4.86 14.88 5.22C14.97 5.31 14.97 5.4 15.06 5.67L15.15 5.94C15.15 5.94 15.24 6.03 15.24 6.03C15.42 6.75 16.14 7.2 16.92 7.2C16.92 7.2 16.92 7.2 16.95 7.2"/>
        <path d="M18.12 8.35L17.76 14.56C17.58 16.99 17.49 18.16 16.68 18.88C15.96 19.6 14.7 19.6 12.36 19.6H11.64C9.3 19.6 7.86 19.6 7.32 18.88C6.51 18.16 6.42 16.99 6.24 14.56L5.88 8.35"/>
    </symbol>

    <symbol id="search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5"/>
        <line x1="15.5" y1="15.5" x2="21" y2="21"/>
    </symbol>


</svg>
