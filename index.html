<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="theme-color" content="#f7f6f4" media="(prefers-color-scheme: light)"/>
    <meta name="theme-color" content="#2a2a2a" media="(prefers-color-scheme: dark)"/>
    <meta name="description" content="Идея для игры с малышом на каждый день. Работает офлайн, данные остаются на устройстве."/>

    <title>Занятия с ребенком</title>

    <link rel="manifest" href="manifest.json"/>
    <link rel="stylesheet" href="styles.css"/>

    <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
    <link rel="apple-touch-icon" href="icons/icon-192.png"/>
</head>
<body>

<header id="top" class="width-500 hidden">
    <div class="row gap-10 pad-20">
        <button id="child-select" class="select" type="button">
            <span class="select-value"></span>
        </button>
        <span id="child-age" class="help small"></span>
        <button id="plus" class="icon-button add-child hidden right" type="button"
                data-i18n-aria-label="addChild">
            <svg class="tool">
                <use href="sprite.svg#plus"></use>
            </svg>
        </button>
    </div>
</header>

<main>

<!-- ==========================================================================
     СЕГОДНЯ
     ========================================================================== -->

<section id="today-page" class="hidden">
    <div id="today-scroll" class="scroll">
        <div class="width-500 col gap-20 pad-20 cta-space">
            <div class="row gap-10 today-header">
                <p id="today-child" class="row gap-10">
                    <span id="today-child-name"></span>
                    <span id="today-child-age" class="help small"></span>
                </p>
                <button id="today-back" class="fab-close" type="button" data-i18n-aria-label="close">
                    <svg class="tool">
                        <use href="sprite.svg#close"></use>
                    </svg>
                </button>
            </div>

        <div id="welcome" class="col gap-20 hidden">
            <h3 class="big" data-i18n="welcomeTitle"></h3>
            <p data-i18n="welcomeText"></p>
            <p class="help small" data-i18n="localDataNote"></p>
            <button class="tap add-child" data-i18n="addChild"></button>
        </div>

        <div id="today-empty" class="col gap-20 hidden">
            <h3 class="big" data-i18n="noActivityTitle"></h3>
            <p id="today-empty-text"></p>
            <div class="col gap-10">
                <button id="open-catalogue" class="tap" data-i18n="browseCatalogue"></button>
                <button id="change-conditions" class="help small left" data-i18n="changeConditions"></button>
            </div>
        </div>

        <div id="today-activity" class="col gap-20 hidden">
            <article id="today-body" class="activity"></article>
            <p id="today-status" class="small accent"></p>
            <button id="today-another" class="fab-close" type="button"
                    data-i18n-aria-label="another">
                <svg class="tool">
                    <use href="sprite.svg#refresh"></use>
                </svg>
            </button>
            </div>

            <section id="feedback-form" class="col gap-20">
                <h3 data-i18n="feedbackTitle"></h3>
                <div class="field">
                    <label class="row gap-10" for="fb-status">
                        <span data-i18n="feedbackStatus"></span> <span>—</span>
                        <span id="fb-status-value"></span>
                    </label>
                    <input type="range" id="fb-status" min="0" max="3" step="1" value="3">
                </div>
                <div id="fb-observed" class="col gap-20">
                    <div class="field">
                        <label class="row gap-10" for="fb-interest">
                            <span data-i18n="feedbackInterest"></span> <span>—</span>
                            <span id="fb-interest-value"></span>
                        </label>
                        <input type="range" id="fb-interest" min="0" max="3" step="1" value="3">
                    </div>
                    <div class="field">
                        <label class="row gap-10" for="fb-difficulty">
                            <span data-i18n="feedbackDifficulty"></span> <span>—</span>
                            <span id="fb-difficulty-value"></span>
                        </label>
                        <input type="range" id="fb-difficulty" min="0" max="3" step="1" value="3">
                    </div>
                </div>
                <div id="fb-reason-field" class="field">
                    <span class="label" data-i18n="feedbackReason"></span>
                    <div id="fb-reason" class="chips" role="group" data-i18n-aria-label="feedbackReason"></div>
                </div>
                <label class="field">
                    <span class="label" data-i18n="comment"></span>
                    <textarea id="fb-comment" class="input" rows="2" maxlength="300"
                              data-i18n-placeholder="commentPlaceholder"></textarea>
                </label>
                <button id="feedback-save" class="fab-round hidden" type="button" data-i18n-aria-label="save">
                    <svg class="tool">
                        <use href="sprite.svg#ok"></use>
                    </svg>
                </button>
            </section>
        </div>
    </div>
</section>

<!-- ==========================================================================
     ЗАНЯТИЯ
     ========================================================================== -->

<section id="activities-page" class="width-500 safe hidden">
    <h2 data-i18n="activities"></h2>
    <div class="pad-20 col gap-15">
        <div class="text-field">
            <input id="search" class="input" type="text" autocomplete="off" enterkeyhint="search"
                   data-i18n-placeholder="searchPlaceholder" data-i18n-aria-label="searchPlaceholder">
            <button id="search-clear" class="clear hidden" data-i18n-aria-label="clear">
                <svg class="tool">
                    <use href="sprite.svg#close"></use>
                </svg>
            </button>
        </div>
        <div id="filter-area" class="chips tabs" role="group" data-i18n-aria-label="filterArea"></div>
        <div class="field">
            <span class="label" data-i18n="filterAge"></span>
            <button id="filter-age" class="input select" type="button" aria-haspopup="dialog">
                <span class="select-value"></span>
            </button>
        </div>
        <div class="field">
            <label class="row gap-10" for="filter-duration">
                <span data-i18n="filterDuration"></span> <span>—</span>
                <span id="filter-duration-value"></span>
            </label>
            <input type="range" id="filter-duration" min="0" max="15" step="5" value="0">
        </div>
        <div class="field">
            <span class="label" data-i18n="filterInterest"></span>
            <div id="filter-interest" class="chips" role="group" data-i18n-aria-label="filterInterest"></div>
        </div>
        <p id="catalogue-status" class="help small"></p>
    </div>
    <ul id="activity-list" class="list"></ul>
    <p id="activity-empty" class="empty hidden" data-i18n="nothingFound"></p>
</section>

<!-- ==========================================================================
     ИСТОРИЯ
     ========================================================================== -->

<section id="history-page" class="width-500 safe hidden">
    <h2 data-i18n="history"></h2>
    <div class="pad-20 col gap-15">
        <div id="history-filter" class="chips tabs" role="group"
             data-i18n-aria-label="historyFilterLabel"></div>
        <div id="history-area" class="chips tabs" role="group" data-i18n-aria-label="filterArea"></div>
    </div>
    <ul id="history-list" class="list"></ul>
    <p id="history-empty" class="empty hidden" data-i18n="historyEmpty"></p>
</section>

<!-- ==========================================================================
     РЕБЁНОК
     ========================================================================== -->

<section id="child-page" class="width-500 safe hidden">
    <h2 id="child-page-title"></h2>

    <div id="child-none" class="pad-20 col gap-20">
        <p data-i18n="noChildText"></p>
    </div>

    <div id="child-profile" class="col gap-30">
        <section class="pad-20 col gap-20">
            <label class="field">
                <span class="label" data-i18n="name"></span>
                <input id="child-name-input" class="input" maxlength="40" autocomplete="off">
            </label>
            <div class="date-fields">
                <label class="label" for="child-birth-input" data-i18n="birthDate"></label>
                <label class="label" for="child-due-input" data-i18n="dueDate"></label>
                <input id="child-birth-input" class="input mono" type="text" inputmode="numeric"
                       placeholder="31.12.2000" maxlength="10" autocomplete="off" autocapitalize="off"
                       spellcheck="false">
                <input id="child-due-input" class="input mono" type="text" inputmode="numeric"
                       placeholder="31.12.2000" maxlength="10" autocomplete="off" autocapitalize="off"
                       spellcheck="false">
            </div>
            <div class="field">
                <span class="label" data-i18n="gender"></span>
                <div id="child-gender" class="segment" style="--n:3;--i:0" role="group"
                     data-i18n-aria-label="gender">
                    <button type="button" data-gender="unspecified"></button>
                    <button type="button" data-gender="female"></button>
                    <button type="button" data-gender="male"></button>
                </div>
            </div>
            <button id="child-cancel" class="help small hidden" type="button" data-i18n="cancel"></button>
        </section>

        <div id="child-details" class="col gap-30">
            <section class="pad-20 col gap-10">
                <h3 data-i18n="skillsTitle"></h3>
                <p class="help small" data-i18n="skillsNote"></p>
                <div id="skills"></div>
            </section>

            <section class="pad-20 col gap-10">
                <h3 data-i18n="interestsTitle"></h3>
                <p class="help small" data-i18n="interestsNote"></p>
                <div id="interests" class="chips" role="group" data-i18n-aria-label="interestsTitle"></div>
            </section>

            <section class="pad-20 col gap-15">
                <div class="col gap-5">
                    <h3 data-i18n="conditionsTitle"></h3>
                    <p class="help small" data-i18n="conditionsNote"></p>
                </div>
                <div class="field">
                    <span class="label" data-i18n="durationLabel"></span>
                    <div id="condition-duration" class="chips" role="group" data-i18n-aria-label="durationLabel"></div>
                </div>
                <div class="field">
                    <span class="label" data-i18n="environmentLabel"></span>
                    <div id="condition-environment" class="chips" role="group" data-i18n-aria-label="environmentLabel"></div>
                </div>
                <div class="field">
                    <span class="label" data-i18n="intensityLabel"></span>
                    <div id="condition-intensity" class="chips" role="group" data-i18n-aria-label="intensityLabel"></div>
                </div>
                <div class="field">
                    <span class="label" data-i18n="materialsLabel"></span>
                    <div id="condition-materials" class="chips" role="group" data-i18n-aria-label="materialsLabel"></div>
                </div>
            </section>

            <section class="pad-20 col gap-10">
                <button id="child-delete" class="red" data-i18n="deleteChild"></button>
            </section>
        </div>
    </div>
</section>

<!-- ==========================================================================
     НАСТРОЙКИ
     ========================================================================== -->

<section id="settings-page" class="width-500 safe hidden">
    <h2 data-i18n="settings"></h2>
    <div class="pad-20 col gap-10">
        <p class="help small" data-i18n="privacyNote"></p>
        <p class="help small" data-i18n="disclaimer"></p>
    </div>

    <a href="https://pay.cloudtips.ru/p/9e3a23d6" target="_blank" rel="noopener">
        <svg class="icon">
            <use href="sprite.svg#heart"></use>
        </svg>
        <span data-i18n="support"></span>
    </a>
    <a href="mailto:yuzhakov.gleb@gmail.com?subject=Daybook">
        <svg class="icon">
            <use href="sprite.svg#chat"></use>
        </svg>
        <span data-i18n="mailTo"></span>
    </a>
    <a href="privacy.html" target="_blank">
        <svg class="icon">
            <use href="sprite.svg#shield"></use>
        </svg>
        <span data-i18n="privacy"></span>
    </a>

    <button id="export">
        <svg class="icon">
            <use href="sprite.svg#download"></use>
        </svg>
        <span data-i18n="exportData"></span>
    </button>
    <button id="import">
        <svg class="icon">
            <use href="sprite.svg#upload"></use>
        </svg>
        <span data-i18n="importData"></span>
    </button>
    <input id="import-input" type="file" accept="application/json,.json" hidden>
    <button id="reset-preferences">
        <svg class="icon">
            <use href="sprite.svg#refresh"></use>
        </svg>
        <span data-i18n="resetPreferences"></span>
    </button>
    <button id="delete-all" class="red">
        <svg class="icon">
            <use href="sprite.svg#trash"></use>
        </svg>
        <span data-i18n="deleteAll"></span>
    </button>
</section>

</main>

<!-- ==========================================================================
     НАВИГАЦИЯ
     ========================================================================== -->

<nav id="nav-bar" data-i18n-aria-label="navigation">
    <div id="nav">
        <button id="active" data-page="activities" class="active" data-i18n-aria-label="activities" aria-current="page">
            <svg>
                <use href="sprite.svg#search"></use>
            </svg>
        </button>
        <button id="today" data-i18n-aria-label="today">
            <svg>
                <use href="sprite.svg#plus"></use>
            </svg>
        </button>
        <button data-page="history" data-i18n-aria-label="history">
            <svg>
                <use href="sprite.svg#history"></use>
            </svg>
        </button>
        <button data-page="child" data-i18n-aria-label="child">
            <svg>
                <use href="sprite.svg#child"></use>
            </svg>
        </button>
        <button data-page="settings" data-i18n-aria-label="settings">
            <svg>
                <use href="sprite.svg#settings"></use>
            </svg>
        </button>
    </div>
</nav>

<!-- ==========================================================================
     ШТОРКИ И ОКНА
     ========================================================================== -->

<div id="overlay"></div>

<div id="activity-sheet" class="sheet full activity" role="dialog" aria-modal="true">
    <button type="button" class="icon-button close" data-i18n-aria-label="close">
        <svg class="tool">
            <use href="sprite.svg#close"></use>
        </svg>
    </button>
</div>

<div id="options-sheet" class="sheet center small" role="dialog" aria-modal="true" aria-labelledby="options-title">
    <div class="row between">
        <h3 id="options-title"></h3>
        <button type="button" class="icon-button close" data-i18n-aria-label="close">
            <svg class="tool">
                <use href="sprite.svg#close"></use>
            </svg>
        </button>
    </div>
    <div id="options-list" class="options sheet-scroll"></div>
</div>

<div id="modal" hidden>
    <div class="dialog" role="dialog" aria-modal="true">
        <p id="question"></p>
        <div class="actions">
            <button id="modal-yes"></button>
            <button id="modal-no" data-i18n="cancel"></button>
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
